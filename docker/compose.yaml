name: {{project-name}}

services:
{%- if use_db %}
  db:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: {{crate_name}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: {{crate_name}}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{crate_name}} -d {{crate_name}}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
{% endif %}
  {{project-name}}:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: {{project-name}}:${IMAGE_TAG:-latest}
{%- if use_db %}
    depends_on:
      db:
        condition: service_healthy
{%- endif %}
    environment:
{%- if use_db %}
      DATABASE_URL: postgres://{{crate_name}}:${POSTGRES_PASSWORD}@db:5432/{{crate_name}}
{%- endif %}
      RUST_LOG: ${RUST_LOG:-info}
    # Uncomment once this binary listens on a port. Bind to loopback unless the
    # service is meant to be reachable from outside the host.
    # ports:
    #   - "127.0.0.1:3000:3000"
    restart: unless-stopped
{%- if use_db %}

volumes:
  pgdata:
{%- endif %}
