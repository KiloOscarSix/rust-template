name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
{% raw %}  group: ${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  RUSTFLAGS: ""
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  SQLX_OFFLINE: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
{% raw %}          save-if: ${{ github.ref == 'refs/heads/main' }}{% endraw %}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: ./.github/actions/cancel-run
        if: failure()

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
{% raw %}          save-if: ${{ github.ref == 'refs/heads/main' }}{% endraw %}
          cache-on-failure: true
      - run: cargo test --workspace --all-targets --all-features --locked
      - uses: ./.github/actions/cancel-run
        if: failure()

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: build (release)
    needs: [fmt, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
{% raw %}          save-if: ${{ github.ref == 'refs/heads/main' }}{% endraw %}
          cache-on-failure: true
      - run: cargo build --workspace --all-features --locked --release
{%- if kind == "bin" %}
      - uses: actions/upload-artifact@v4
        with:
          name: {{project-name}}-x86_64-unknown-linux-gnu
          path: target/release/{{project-name}}
          retention-days: 7
          if-no-files-found: error
{%- endif %}
{%- if use_docker and kind == "bin" %}

  # Built on every trigger so a pull request proves the Dockerfile still works,
  # but only pushed to GHCR from `main` and `v*` tags. Without this the
  # Dockerfile silently rots: nothing else in CI ever builds it.
  image:
    name: image
    needs: [fmt, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
{% raw %}          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}{% endraw %}

      - name: Compute lowercase image ref
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
{% raw %}          images: ${{ steps.img.outputs.ref }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short{% endraw %}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
{% raw %}          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.img.outputs.ref }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache,mode=max', steps.img.outputs.ref) || '' }}{% endraw %}
{%- endif %}
